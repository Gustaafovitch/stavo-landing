<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAVO - Vind de sport die bij jou past</title>
    <!-- Google Fonts voor sportieve/moderne typografie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6600; /* QuickFit Oranje */
            --bg-dark: #0a0a0a;
            --bg-light-dark: #141414;
            --text-light: #f5f5f5;
            --text-grey: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, .impact-text {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* --- NAVIGATIE --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            position: absolute;
            width: 100%;
            z-index: 100;
        }
        .logo {
            font-size: 2rem;
            color: var(--primary);
            font-family: 'Anton', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- HERO SECTIE --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 5%;
            position: relative;
            background: linear-gradient(135deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.4) 100%), 
                        url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&q=80&w=2000') center/cover;
        }
        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 8rem);
            line-height: 1.05;
            margin-bottom: 1rem;
            color: var(--primary);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            max-width: 1200px;
        }
        .hero p {
            font-size: clamp(1rem, 2vw, 1.3rem);
            max-width: 600px;
            margin-bottom: 2.5rem;
            font-weight: 400;
            color: var(--text-light);
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 1.2rem 2.5rem;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #fff;
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 102, 0, 0.2);
        }

        /* --- SCROLLING TEKST (Marquee) --- */
        .marquee-container {
            padding: 4rem 0;
            background-color: var(--primary);
            color: var(--bg-dark);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            transform: rotate(-2deg);
            margin: -2rem -2vw;
            width: 104vw;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .marquee-text {
            font-size: 3rem;
            display: inline-block;
            animation: scroll-left 25s linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- TRAJECT/METHODE SECTIE --- */
        .method {
            padding: 8rem 5%;
            background-color: var(--bg-dark);
        }
        .method h2 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 4rem;
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background-color: var(--bg-light-dark);
            padding: 3rem 2rem;
            border-bottom: 4px solid var(--bg-light-dark);
            border-radius: 8px;
            transition: all 0.4s ease;
        }
        .card:hover {
            border-bottom-color: var(--primary);
            transform: translateY(-10px);
            background-color: #1a1a1a;
        }
        .card h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .card .step {
            font-family: 'Anton', sans-serif;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.05);
            margin-bottom: -1.5rem;
            display: block;
        }
        .card p {
            color: var(--text-grey);
            font-size: 0.95rem;
        }

        /* --- LEAD MAGNET (E-MAIL OPT-IN) --- */
        .lead-magnet {
            padding: 8rem 5%;
            text-align: center;
            background: linear-gradient(to top, var(--bg-dark), var(--bg-light-dark));
        }
        .lead-magnet h2 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .lead-magnet p {
            max-width: 600px;
            margin: 0 auto 3rem auto;
            color: var(--text-grey);
        }
        .form-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group input {
            flex: 1;
            min-width: 250px;
            padding: 1.2rem;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-dark);
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group button {
            width: auto;
        }

        /* --- FAQ SECTIE --- */
        .faq {
            padding: 8rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }
        .faq h2 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 3rem;
            text-align: center;
        }
        .faq-item {
            background: var(--bg-light-dark);
            margin-bottom: 1rem;
            border-radius: 4px;
            overflow: hidden;
        }
        .faq-question {
            padding: 1.5rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }
        .faq-question:hover {
            background: #1f1f1f;
        }
        .faq-icon {
            color: var(--primary);
